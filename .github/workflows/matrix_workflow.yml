name: Matrix Demo
on: 
  push:
     branch:
        Dev
jobs: 
   build:
      continue-on-error: true 
      strategy: 
       matrix:
         operating-system: [ubuntu-latestssd, windows-latest]
      runs-on:  ${{matrix.operating-system}}
      steps: 
       -  name: Get code
          uses: actions/checkout@v3
       -  name: setup JDK
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '21'
       